name = "stocked-crowd"
main = "crowd-worker.js"
compatibility_date = "2024-11-01"

# KV namespace binding. Create it once, then paste the id below:
#   npx wrangler kv namespace create CROWD
# The command prints an id — put it here.
[[kv_namespaces]]
binding = "CROWD"
id = "PASTE_KV_NAMESPACE_ID_HERE"

# CROWD_KEY is a SECRET, not stored here. Set it with:
#   npx wrangler secret put CROWD_KEY
# Use the same value as CrowdDB.defaultKey (or CrowdWorkerKey in Secrets.xcconfig).
