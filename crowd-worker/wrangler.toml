name = "stocked-crowd"
main = "crowd-worker.js"
compatibility_date = "2024-11-01"

# 1) Create a KV namespace:  npx wrangler kv namespace create CROWD
#    then paste its id below.
[[kv_namespaces]]
binding = "CROWD"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# 2) Set the shared secret the app sends as X-Stocked-Key:
#    npx wrangler secret put CROWD_KEY
