name = "stocked-receipt-worker"
main = "index.js"
compatibility_date = "2025-01-01"

# ── KV namespaces (existing) ──────────────────────────────────────────────────
# RATE_KV also stores household snapshot mirrors ("hh:") and daily-brief blobs.
[[kv_namespaces]]
binding = "RATE_KV"
id = "e0bde8969aad4e3c88b6281227bc08d1"

[[kv_namespaces]]
binding = "CROWD"
id = "030167e99e0c41f4a233bb139a8b466f"

# ── Durable Object: household sync (improvement #1) ───────────────────────────
# Requires the Workers Paid plan. The class is exported from index.js.
[[durable_objects.bindings]]
name = "HOUSEHOLD_DO"
class_name = "HouseholdDO"

[[migrations]]
tag = "v1"
# SQLite-backed DO storage (Cloudflare no longer allows KV-backed DO namespaces
# for new classes). The key-value storage API (storage.get/put/deleteAll) used by
# HouseholdDO works unchanged on the SQLite backend.
new_sqlite_classes = ["HouseholdDO"]

# ── Native Rate Limiting bindings (improvement #2) ────────────────────────────
# Atomic, per-key. period must be 10 or 60 (seconds). namespace_id is any unique
# integer string per limiter. If these are absent the Worker falls back to a
# coarse Cache-API counter, so it keeps working during rollout.
[[unsafe.bindings]]
name = "RL_AI"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_RECEIPT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "RL_HOUSEHOLD"
type = "ratelimit"
namespace_id = "1003"
# Applies to /household/push only. Generous: the app auto-syncs every ~6s and can
# burst on retry, and multiple household members share an IP behind NAT.
simple = { limit = 300, period = 60 }

[[unsafe.bindings]]
name = "RL_CROWD"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_DEFAULT"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

# ── Queues: daily brief generation (new function #10) ─────────────────────────
# Requires the Workers Paid plan. Create the queues first (see MANUAL_STEPS.md).
[[queues.producers]]
queue = "stocked-briefs"
binding = "BRIEF_QUEUE"

[[queues.consumers]]
queue = "stocked-briefs"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "stocked-briefs-dlq"

# ── Cron Triggers: enqueue briefs daily (free) ────────────────────────────────
[triggers]
crons = ["0 13 * * *"]   # 13:00 UTC every day

# ── Observability (improvement #10) ───────────────────────────────────────────
[observability]
enabled = true

# ── Plain vars (non-secret) ───────────────────────────────────────────────────
[vars]
ANTHROPIC_MODEL = "claude-sonnet-5"
APPLE_BUNDLE_ID = "com.sowens.Stocked"     # your app's bundle id
APP_ATTEST_ENABLED = ""                      # set to "1" only after wiring App Attest
# cPanel is abandoned — /content/* now serves from the GitHub site-repo (Recipe Studio pushes here).
CONTENT_ORIGIN = "https://raw.githubusercontent.com/sahmoee/site-repo/master"
# AI_DAILY_LIMIT = "200"                            # optional: per-session daily AI cap (#7)
# APPLE_TEAM_ID = "XXXXXXXXXX"                      # optional: for /.well-known/apple-app-site-association (#20)
# CORS_ALLOW_ORIGINS = "https://example.com"       # optional: comma-separated allowlist; unset → "*" (non-credentialed, as before)

# ── Optional feature bindings (create then uncomment; features degrade gracefully until then) ──
# KV for price-watch, per-user AI quota, and encrypted backups (#6/#7/#16):
#   wrangler kv namespace create FEATURES_KV   → paste id below
# QA report bridge storage. Optional: /qa/reports falls back to the CROWD
# namespace when this is unbound, so the routes work on deploy with no infra
# change. Bind this and redeploy to move QA reports onto their own namespace.
# [[kv_namespaces]]
# binding = "QA_KV"
# id = "REPLACE_WITH_NAMESPACE_ID"

# [[kv_namespaces]]
# binding = "FEATURES_KV"
# id = "<id>"
#
# R2 for image mirror + feedback/screenshot uploads (#13/#15):
#   wrangler r2 bucket create stocked-media
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "stocked-media"
#
# D1 for analytics / price history (#14):  wrangler d1 create stocked-analytics
#   then: CREATE TABLE events (ts INTEGER, name TEXT, props TEXT);
# [[d1_databases]]
# binding = "DB"
# database_name = "stocked-analytics"
# database_id = "<id>"

# ── Secrets (set with `wrangler secret put`, NOT here) ────────────────────────
#   ANTHROPIC_API_KEY     (sk-ant-…)
#   STOCKED_SHARED_KEY    (long random string; must match the app)
#   SESSION_SIGNING_KEY   (long random string; signs short-lived session tokens)
#   ── optional, for the new features (each endpoint 501s until its secret is set): ──
#   SPOONACULAR_KEY, USDA_KEY, API_NINJAS_KEY, EDAMAM_KEY, EDAMAM_ID, RAPIDAPI_KEY   (#1 key proxy)
#   SMTP_RELAY_URL, SMTP_RELAY_TOKEN, SUPPORT_EMAIL   (#5/#12 email)
#   APNS_KEY_P8, APNS_KEY_ID, APNS_TEAM_ID            (#4 push, scaffold)
