name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: stocked-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-validation:
    name: iOS build and unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app || \
            sudo xcode-select -s /Applications/Xcode_26.app
      - name: Create non-secret build configuration
        run: cp Secrets.example.xcconfig Secrets.xcconfig
      - name: Build Stocked for a generic physical device
        run: |
          xcodebuild \
            -project Stocked.xcodeproj \
            -scheme Stocked \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            clean build
      - name: Run Stocked unit and performance tests on iPhone and iPad
        run: |
          mkdir -p test-results
          PHONE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          IPAD_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPad/{print $2; exit}')"
          test -n "$PHONE_ID" && test -n "$IPAD_ID"
          xcodebuild \
            -project Stocked.xcodeproj \
            -scheme Stocked \
            -destination "platform=iOS Simulator,id=$PHONE_ID" \
            -skipPackagePluginValidation \
            build-for-testing
          xcodebuild \
            -project Stocked.xcodeproj \
            -scheme Stocked \
            -destination "platform=iOS Simulator,id=$PHONE_ID" \
            -skipPackagePluginValidation \
            -parallel-testing-enabled NO \
            -resultBundlePath test-results/iphone.xcresult \
            test-without-building
          xcodebuild \
            -project Stocked.xcodeproj \
            -scheme Stocked \
            -destination "platform=iOS Simulator,id=$IPAD_ID" \
            -skipPackagePluginValidation \
            -parallel-testing-enabled NO \
            -resultBundlePath test-results/ipad.xcresult \
            test-without-building
      - name: Preserve test results and snapshot candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stocked-test-results
          path: |
            test-results/
            StockedTests/__Snapshots__/**/*.png
          if-no-files-found: ignore
          retention-days: 7
