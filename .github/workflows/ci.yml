name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ios-build-test:
    name: iOS build & unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || true
      - name: Build & test (Stocked)
        run: |
          set -o pipefail
          xcodebuild \
            -project Stocked.xcodeproj \
            -scheme Stocked \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            clean build test | xcpretty || xcodebuild \
            -project Stocked.xcodeproj \
            -scheme Stocked \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            clean build test

  worker-test:
    name: Worker unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stocked-receipt-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - run: npm test
