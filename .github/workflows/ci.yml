name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ios-build:
    name: Generic iOS device build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app || \
            sudo xcode-select -s /Applications/Xcode_26.app
      - name: Create non-secret build configuration
        run: cp Secrets.example.xcconfig Secrets.xcconfig
      - name: Build Stocked for a generic physical device
        run: |
          xcodebuild \
            -project Stocked.xcodeproj \
            -scheme Stocked \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            clean build
