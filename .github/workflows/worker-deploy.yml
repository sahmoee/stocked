# Worker CI/CD — tests on every push that touches the worker; deploys only from main.
# Requires repo secrets: CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers template) and
# CLOUDFLARE_ACCOUNT_ID. See PLATFORM_SETUP_STEP_BY_STEP.md §3b.
name: worker

on:
  push:
    paths:
      - "stocked-receipt-worker/**"
      - ".github/workflows/worker-deploy.yml"
  pull_request:
    paths:
      - "stocked-receipt-worker/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: stocked-receipt-worker }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Run worker tests
        run: node --test tests/*.mjs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: stocked-receipt-worker }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Deploy with Wrangler
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-check /health
        run: |
          sleep 5
          curl -fsS https://api.sowensstudios.com/health || \
          curl -fsS https://stocked-receipt-worker.stocked.workers.dev/health
