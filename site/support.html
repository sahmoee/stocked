<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support — Stocked</title></head>
<body>
<h1>Stocked Support</h1>
<p>Email <a href="mailto:support@sowensstudios.com">support@sowensstudios.com</a> or use the form below.
If the app gave you a diagnostics reference (STK-…), include it.</p>
<form name="support" method="POST" data-netlify="true">
  <p><label>Your email<br><input type="email" name="email" required></label></p>
  <p><label>Diagnostics reference (optional)<br><input type="text" name="reference" placeholder="STK-XXXXXXXXXX"></label></p>
  <p><label>What's happening?<br><textarea name="message" rows="6" required></textarea></label></p>
  <p><button type="submit">Send</button></p>
</form>
</body></html>
